# Gitleaks configuration for Mushroom.
#
# Mushroom scans for credentials itself, which makes it an awkward repository
# to scan: it necessarily contains credential *patterns*, and tests that plant
# credential-shaped strings to prove the scanning works. Both look exactly like
# what a secret scanner is for.
#
# The rule here is narrow: allowlist the files that must contain such strings
# to do their job, and nothing else. Application code and notes get the full
# default rule set.

[extend]
useDefault = true

[[allowlists]]
description = """
The vendored gitleaks rule table. It is a copy of gitleaks' own patterns, so it
contains fragments that match gitleaks' own patterns — scanning it is scanning
the scanner. Regenerated by tools/vendor-gitleaks-rules.py; nothing is written
here by hand.
"""
paths = ['''src-tauri/src/ai/privacy/gitleaks_rules\.rs''']

[[allowlists]]
description = """
The privacy tests. These plant credential-shaped strings on purpose and assert
they never reach the network; a test that proves an AWS key is redacted has to
contain something shaped like an AWS key.

Every value is fabricated. They are also split with `concat!` in the source so
the provider prefix never sits beside its body — see the `fixture_hygiene` test
in rules.rs, which fails the build if a whole token reappears. This allowlist is
the second line, for the fragments that remain recognisable.
"""
paths = [
    '''src-tauri/tests/privacy_leak\.rs''',
    '''src-tauri/tests/bench\.rs''',
    '''src-tauri/src/ai/privacy/rules\.rs''',
    '''src-tauri/src/ai/privacy/redact\.rs''',
    '''src-tauri/src/ai/privacy/mod\.rs''',
    '''src-tauri/src/ai/privacy/last\.rs''',
]
