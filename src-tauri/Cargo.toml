[package]
name = "mushroom"
version = "0.2.0"
description = "Local-first personal knowledge and notes with AI-powered retrieval"
authors = ["Travis Duong"]
license = "Apache-2.0"
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name.
# Required on Windows — see https://github.com/rust-lang/cargo/issues/8519
name = "mushroom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
walkdir = "2"
# dunce::canonicalize avoids the \?\ verbatim prefix that breaks path
# comparison and display on Windows.
dunce = "1"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }

[dev-dependencies]
tempfile = "3"
walkdir = "2"

# Read the optimization guideline for more details:
# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
